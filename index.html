    <!-- Third-party browser extension error suppressor (e.g. MetaMask, Phantom) -->
    <script>
      (function() {
        window.addEventListener('unhandledrejection', function(e) {
          var r = e.reason;
          var msg = typeof r === 'string' ? r : (r && r.message ? r.message : '');
          if (/metamask|ethereum|web3|wallet|chrome-extension/i.test(msg)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(e) {
          var msg = e.message || '';
          var fn = e.filename || '';
          if (/metamask|ethereum|web3|wallet/i.test(msg) || /chrome-extension|moz-extension|safari-extension/i.test(fn)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
