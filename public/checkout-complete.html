<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Returning to RCI…</title>
    <style>
      html, body { margin: 0; height: 100%; background: #020617; color: #e2e8f0; font-family: system-ui, sans-serif; }
      body { display: grid; place-items: center; text-align: center; padding: 24px; }
      p { max-width: 420px; line-height: 1.6; }
      a { color: #fbbf24; }
    </style>
  </head>
  <body>
    <p>
      Returning you to Revival Church International…
      <br />
      <a href="/">Click here if you are not redirected.</a>
    </p>
    <script>
      (function () {
        var target = '/?' + window.location.search.replace(/^\?/, '');
        try {
          if (window.top && window.top !== window.self) {
            window.top.location.replace(target);
          } else {
            window.location.replace(target);
          }
        } catch (error) {
          window.location.replace(target);
        }
      })();
    </script>
  </body>
</html>
